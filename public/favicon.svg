<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A table with three rows; the first cell is done. Ink tile in light mode, inverted in dark mode. -->
  <style>
    .tile { fill: #1d1d1f; } .row { fill: #ffffff; }
    @media (prefers-color-scheme: dark) { .tile { fill: #f5f5f7; } .row { fill: #1d1d1f; } }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <circle cx="9.5" cy="10" r="2.2" fill="#34c759"/>
  <rect class="row" x="14" y="8.5" width="10" height="3" rx="1.5"/>
  <rect class="row" x="7.5" y="15" width="16.5" height="3" rx="1.5" opacity=".55"/>
  <rect class="row" x="7.5" y="21.5" width="12" height="3" rx="1.5" opacity=".3"/>
</svg>
