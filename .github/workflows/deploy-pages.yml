name: Deploy Pages

# Builds the SPA and uploads it to the Cloudflare Pages project on every change outside supabase/.
# Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# optional VITE_DEMO_EMAIL / VITE_DEMO_PASSWORD.

on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', 'docs/**', '*.md']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3' # wrangler 4 delegates `pages` commands to Workers and fails in CI
          command: pages deploy dist --project-name gtm-toolkit --branch main
